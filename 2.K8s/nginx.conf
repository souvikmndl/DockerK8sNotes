# worker_processes:
# - controls how many parallel processes Nginx spawns to handle client requests
# What is a "Worker Process" ?
# - instead of using a new process for every incoming connection, Nginx uses worker processes that 
#.   handle many connections using a single-threaded event loop
# What does this number represent?
# - the value is the number of worker processes Nginx should create
# - each worker process runs independently and can handle its own set of connections
# Each configuration directly influences how well it can handle traffic/performance
# Should be tuned according to the server's hardware (CPU cores) and expected traffic load
# set it to the number of CPU cores of the server on which NGINX is running
# it can also be to auto;

# worker_connections:
# determines how many simultaneous connections a single worker_process can handle
# we have worker_process set to 1 and worker_connections set to 1024; if processes were set to 2,
# then our system could handle 1024*2 simultaneous connections
# more connections increase memory useage, you have to find the balance for your system

worker_processes 1;

events {
    worker_connections 1024;
}

# CONTEXTS
# A few top-level directives, referred to as contexts, group together the directives that apply
# to different traffic types.
# - events - General connection processing
# - http - HTTP traffic
# - mail - Mail traffic
# - stream - TCP and UDP traffic
# Directives placed outside of these contexts are said to be in the main context

# server BLOCK
# Defines how NGINX should handle requests for a particular domain or IP address
# - How to listen for connections
# - Which domain or subdomain the config applies to
# - How to route the requests
# server_name: which domain or IP address this serevr block should respond to

# location BLOCK 
#  - how specific types of requests (such as URLs or file types) should be handled
#  - the root(/) URL will apply to all requests unless more specific location blocks exist
# - proxy_pass: tells nginx to "pass" the request to another server, making it act as a 
#.  reverse proxy
# - Upstream Bock: refers to servers that Nginx forwards requests to (in this example our
#.                  nodejs servers that the requests will be forwared to)
# Upstream servers: Refers to traffic going from a client toward the source or higher-level infra,
#.                  in this case application server
# Downstream servers: Traffic going back to the client is "downstream"
# include mime.types: tells nginx to include response file type in the response (Content-Type)
# mime.types is actually a file, that nginx uses to map file extension to MIME types

# how to handle http connections
http {
    include mime.types;

    upstream nodejs_cluster {
        least_conn; # Load Balancing Algorithm (round robbin is default)
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://nodejs_cluster; # we defined the servers in this cluster by their hostname and port above
            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}


